<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#21262d" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.4" />
    </linearGradient>

    <!-- Dynamic Pulse Effect -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseCircle {
      0% { transform: scale(1); opacity: 0.2; }
      50% { transform: scale(1.15); opacity: 0.5; }
      100% { transform: scale(1); opacity: 0.2; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-15px) translateX(10px); }
      100% { transform: translateY(0px) translateX(0px); }
    }
    @keyframes dashOffset {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -100; }
    }
    .dynamic-bg-circle {
      animation: pulseCircle 6s infinite ease-in-out;
      transform-origin: center;
    }
    .particle {
      animation: floatParticle 4s infinite ease-in-out;
    }
    .animated-line {
      stroke-dasharray: 10 15;
      animation: dashOffset 10s linear infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="350" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2" />

  <!-- Animated Dynamic Background Elements -->
  <circle cx="1000" cy="90" r="180" fill="#38bdf8" class="dynamic-bg-circle" style="filter: blur(40px);" />
  <circle cx="150" cy="280" r="140" fill="#c084fc" class="dynamic-bg-circle" style="filter: blur(50px); animation-delay: -3s;" />

  <!-- Background Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300" />
    <path d="M 100,0 L 100,350 M 200,0 L 200,350 M 300,0 L 300,350 M 400,0 L 400,350 M 500,0 L 500,350 M 600,0 L 600,350 M 700,0 L 700,350 M 800,0 L 800,350 M 900,0 L 900,350 M 1000,0 L 1000,350 M 1100,0 L 1100,350" />
  </g>

  <!-- Tech Lines Decorative Background -->
  <path d="M 800 280 L 950 200 L 1150 200" fill="none" stroke="url(#primaryGlow)" stroke-width="2" opacity="0.4" class="animated-line" />
  <path d="M 850 310 L 980 230 L 1100 230" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" />

  <!-- Abstract AIO Desktop Graphic (Right Side Background Element) -->
  <g transform="translate(860, 60)" opacity="0.85">
    <!-- Monitor Base -->
    <ellipse cx="140" cy="215" rx="70" ry="12" fill="#30363d" stroke="#484f58" stroke-width="2" />
    <path d="M 125 170 L 155 170 L 160 215 L 120 215 Z" fill="#21262d" stroke="#30363d" />
    <!-- Screen Outer Frame -->
    <rect x="20" y="10" width="240" height="160" rx="10" fill="url(#cardGrad)" stroke="#484f58" stroke-width="2" />
    <!-- Screen Inner Display -->
    <rect x="28" y="18" width="224" height="144" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <!-- Graphic Elements inside Screen -->
    <path d="M 40 130 Q 80 80, 120 100 T 200 60" fill="none" stroke="url(#primaryGlow)" stroke-width="3" filter="url(#glowEffect)" />
    <circle cx="200" cy="60" r="5" fill="#38bdf8" class="particle" />
    <circle cx="120" cy="100" r="4" fill="#818cf8" />
  </g>

  <!-- FOREGROUND CONTENT (Guaranteed High Contrast & Visible) -->
  <!-- Category Pill -->
  <g transform="translate(60, 45)">
    <rect width="270" height="32" rx="16" fill="#1f2937" stroke="#38bdf8" stroke-width="1.5" />
    <text x="135" y="21" text-anchor="middle" class="badge-text">💻 HARDWARE &amp; LINUX SUITE</text>
  </g>

  <!-- Main Title -->
  <text x="60" y="130" font-size="40" class="title-text" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.8))">
    Awesome All-In-One Desktop Hardware
  </text>

  <!-- Subtitle -->
  <text x="60" y="172" font-size="18" class="subtitle-text">
    Curated Commercial Hardware, Linux Support &amp; Open-Source Software Projects
  </text>

  <!-- Feature Chips / Tags -->
  <g transform="translate(60, 215)">
    <!-- Chip 1 -->
    <g transform="translate(0, 0)">
      <rect width="170" height="36" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="85" y="23" text-anchor="middle" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="13" font-weight="500">🐧 Linux Compatible</text>
    </g>

    <!-- Chip 2 -->
    <g transform="translate(182, 0)">
      <rect width="180" height="36" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="90" y="23" text-anchor="middle" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="13" font-weight="500">🖥️ Form Factor Insights</text>
    </g>

    <!-- Chip 3 -->
    <g transform="translate(374, 0)">
      <rect width="170" height="36" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="85" y="23" text-anchor="middle" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="13" font-weight="500">⚡ Open-Source Apps</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="60" y="290" width="1080" height="4" rx="2" fill="url(#primaryGlow)" />
</svg>
