<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 350"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0d1117"/><stop offset="50%" stop-color="#161b22"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="primaryGlow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#21262d" stop-opacity=".7"/><stop offset="100%" stop-color="#161b22" stop-opacity=".4"/></linearGradient><filter id="glowEffect" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseCircle{0%{transform:scale(1);opacity:.2}50%{transform:scale(1.15);opacity:.5}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-15px) translateX(10px)}}@keyframes dashOffset{0%{stroke-dashoffset:0}}.dynamic-bg-circle{animation:pulseCircle 6s infinite ease-in-out;transform-origin:center}.particle{animation:floatParticle 4s infinite ease-in-out}.animated-line{stroke-dasharray:10 15;animation:dashOffset 10s linear infinite}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;fill:#fff}.subtitle-text{font-weight:400;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#38bdf8}</style><rect width="1200" height="350" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2" rx="16"/><circle cx="1000" cy="90" r="180" fill="#38bdf8" class="dynamic-bg-circle" style="filter:blur(40px)"/><circle cx="150" cy="280" r="140" fill="#c084fc" class="dynamic-bg-circle" style="filter:blur(50px);animation-delay:-3s"/><g stroke="#fff" stroke-width="1" opacity=".08"><path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300"/><path d="M 100,0 L 100,350 M 200,0 L 200,350 M 300,0 L 300,350 M 400,0 L 400,350 M 500,0 L 500,350 M 600,0 L 600,350 M 700,0 L 700,350 M 800,0 L 800,350 M 900,0 L 900,350 M 1000,0 L 1000,350 M 1100,0 L 1100,350"/></g><path fill="none" stroke="url(#primaryGlow)" stroke-width="2" d="M 800 280 L 950 200 L 1150 200" class="animated-line" opacity=".4"/><path fill="none" stroke="#38bdf8" stroke-width="1.5" d="M 850 310 L 980 230 L 1100 230" opacity=".3"/><g opacity=".85" transform="translate(860, 60)"><ellipse cx="140" cy="215" fill="#30363d" stroke="#484f58" stroke-width="2" rx="70" ry="12"/><path fill="#21262d" stroke="#30363d" d="M 125 170 L 155 170 L 160 215 L 120 215 Z"/><rect width="240" height="160" x="20" y="10" fill="url(#cardGrad)" stroke="#484f58" stroke-width="2" rx="10"/><rect width="224" height="144" x="28" y="18" fill="#0d1117" stroke="#30363d" stroke-width="1" rx="6"/><path fill="none" stroke="url(#primaryGlow)" stroke-width="3" d="M 40 130 Q 80 80, 120 100 T 200 60" filter="url(#glowEffect)"/><circle cx="200" cy="60" r="5" fill="#38bdf8" class="particle"/><circle cx="120" cy="100" r="4" fill="#818cf8"/></g><g transform="translate(60, 45)"><rect width="270" height="32" fill="#1f2937" stroke="#38bdf8" stroke-width="1.5" rx="16"/><text x="135" y="21" class="badge-text" text-anchor="middle">💻 HARDWARE &amp; LINUX SUITE</text></g><text x="60" y="130" class="title-text" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.8))" font-size="40">Awesome All-In-One Desktop Hardware</text><text x="60" y="172" class="subtitle-text" font-size="18">Curated Commercial Hardware, Linux Support &amp; Open-Source Software Projects</text><g><g transform="translate(60, 215) translate(0, 0)"><rect width="170" height="36" fill="#21262d" stroke="#30363d" stroke-width="1" rx="8"/><text x="85" y="23" fill="#e6edf3" font-family=